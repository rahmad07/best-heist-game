<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operasi Lentera — Pencurian di Galeri Aruna</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Operasi Lentera: curi rampasan di Galeri Aruna tanpa ketahuan penjaga dan kamera"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/boot.js"></script>
</body>
</html>
